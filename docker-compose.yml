# Artifact relay demo stack.
#
#   docker compose up --build
#
#   relay   http://localhost:8080         switch API + proxy (+ /docs, /demo)
#   blue    http://localhost:9001         upstream A (direct access for probe control)
#   green   http://localhost:9002         upstream B
#
# The upstreams are also reachable inside the network as http://blue:9001 and
# http://green:9001.
name: artifact-relay

services:
  relay:
    build: .
    image: artifact-relay:local
    command: ["python", "-m", "relay.main"]
    environment:
      RELAY_TARGETS: "blue=http://blue:9001,green=http://green:9001"
      RELAY_INITIAL_TARGET: "blue"
      RELAY_PROBE_PATH: "/ready"
      RELAY_PROBE_TIMEOUT: "2"
      RELAY_DRAIN_SECONDS: "5"
      RELAY_CHUNK_SIZE: "65536"
      RELAY_LOG_LEVEL: "INFO"
    ports:
      - "8080:8080"
    depends_on:
      blue:
        condition: service_healthy
      green:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/status', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  blue:
    build: .
    image: artifact-relay:local
    command: ["python", "-m", "uvicorn", "upstream.app:app", "--host", "0.0.0.0", "--port", "9001"]
    environment:
      UPSTREAM_NAME: "blue"
      UPSTREAM_PROBE_DELAY: "0"
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9001/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  green:
    build: .
    image: artifact-relay:local
    command: ["python", "-m", "uvicorn", "upstream.app:app", "--host", "0.0.0.0", "--port", "9001"]
    environment:
      UPSTREAM_NAME: "green"
      UPSTREAM_PROBE_DELAY: "0"
    ports:
      - "9002:9001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9001/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
